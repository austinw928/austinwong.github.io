<body class="bg-[#0C0C0C] text-[#FDFBF7] font-sans antialiased selection:bg-[#FDFBF7] selection:text-[#0C0C0C]">

  <!-- Navigation Bar -->

    <a href="index.html" class="text-xs inline-flex items-center gap-2 text-[#FDFBF7] hover:opacity-80 transition-opacity">

    <div class="hidden md:flex space-x-8">

    <div class="flex flex-col items-start">
      <h1 class="text-6xl md:text-8xl font-serif italic tracking-tight text-[#FDFBF7]">
        Austin Wong
      </h1>
      <p class="mt-6 ml-4 md:ml-8 text-xs md:text-sm tracking-widest uppercase font-semibold text-[#FDFBF7]/80">
        FILMMAKER &nbsp;|&nbsp; DIRECTOR &nbsp;|&nbsp; ACTOR
      </p>
    </div>
  </section>

  <!-- My Work Section -->
  <section class="bg-[#19181A] text-[#FDFBF7] py-20 px-8 border-y border-[#222222]">
    <div class="max-w-4xl mx-auto text-center">
      <h2 class="text-4xl md:text-5xl font-serif italic mb-10 text-[#FDFBF7]">My Work</h2>

        <a href="films.html" class="px-8 py-4 border border-[#FDFBF7]/30 text-xs tracking-widest uppercase font-bold hover:bg-[#FDFBF7] hover:text-[#0C0C0C] transition-all duration-300">

  <!-- Contact Section -->

    <h2 class="text-4xl md:text-5xl font-serif italic mb-6">Contact</h2>
    <p class="text-sm text-[#FDFBF7]/70 mb-8 max-w-md mx-auto">
      For inquiries regarding directing, cinematography, or acting roles, feel free to connect via social media or email.
    </p>
    
    <div class="flex flex-col md:flex-row justify-center items-center gap-6 text-xs tracking-widest uppercase font-bold">

      <a href="https://linkedin.com" target="_blank" class="px-8 py-4 border border-[#FDFBF7]/40 hover:border-[#FDFBF7] hover:bg-[#FDFBF7] hover:text-[#0C0C0C] transition-all duration-300 w-full md:w-auto">

      <a href="https://instagram.com" target="_blank" class="px-8 py-4 border border-[#FDFBF7]/40 hover:border-[#FDFBF7] hover:bg-[#FDFBF7] hover:text-[#0C0C0C] transition-all duration-300 w-full md:w-auto">
