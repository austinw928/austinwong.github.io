<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="austinwong_pavicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austin Wong | Filmmaker & Actor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0C0C0C; color: #FDFBF7; scroll-behavior: smooth; }
        h1, h2, .serif { font-family: 'Playfair Display', serif; }
        .framed-image { position: relative; display: inline-block; }
        .framed-image::before {
            content: ''; position: absolute; top: 12px; left: 12px;
            width: 100%; height: 100%; border: 1.5px solid #FDFBF7; z-index: -1;
        }
    </style>
</head>
<body>

   <!-- Navigation Bar -->
<nav class="sticky top-0 z-50 bg-[#0C0C0C]/95 backdrop-blur-md border-b border-[#222222] text-[#FDFBF7] uppercase tracking-widest font-bold">
  
  <div class="px-6 py-8 flex justify-between items-center">
    <!-- Logo & Name Link (Shifted right with pl-4) -->
    <a href="index.html" class="text-base md:text-lg inline-flex items-center gap-2.5 text-[#FDFBF7] hover:opacity-80 transition-opacity pl-4">
      <img src="austinwong_pavicon.png" alt="Logo" class="w-10 h-10 md:w-12 md:h-12 object-contain">
      <span>AUSTIN WONG</span>
    </a>

    <!-- Desktop Navigation Links (2x Larger: text-sm) -->
    <div class="hidden md:flex space-x-8 text-sm">
      <a href="index.html" class="hover:opacity-50 transition-opacity">Home</a>
      <a href="films.html" class="hover:opacity-50 transition-opacity">Film Credits</a>
      <a href="acting.html" class="hover:opacity-50 transition-opacity">Acting Credits</a>
      <a href="index.html#contact" class="hover:opacity-50 transition-opacity">Contact</a>
    </div>

    <!-- Mobile Hamburger Button -->
    <button id="menu-btn" class="block md:hidden text-[#FDFBF7] focus:outline-none pr-4" aria-label="Toggle Navigation">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Menu (2x Larger: text-base) -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-[#222222] bg-[#0C0C0C] px-6 py-6 flex flex-col space-y-4 text-center text-base">
    <a href="index.html" class="hover:opacity-50 transition-opacity py-2">Home</a>
    <a href="films.html" class="hover:opacity-50 transition-opacity py-2">Film Credits</a>
    <a href="acting.html" class="hover:opacity-50 transition-opacity py-2">Acting Credits</a>
    <a href="index.html#contact" class="hover:opacity-50 transition-opacity py-2">Contact</a>
  </div>

</nav>

<!-- JavaScript to Toggle Mobile Menu -->
<script>
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  menuBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
  });
</script>

    <!-- Hero Section with Custom Gradient Background Image -->
 <section class="relative w-full h-[85vh] min-h-[500px] flex flex-col items-center justify-center bg-cover bg-[0%_0%] md:bg-[position:center_25%] overflow-hidden" style="background-image: url('main_image.png');">
  
  <!-- Content Wrapper forced into column layout -->
  <div class="flex flex-col items-center justify-center text-center">
    
    <!-- Title -->
    <h1 class="text-4xl sm:text-6xl md:text-7xl font-serif serif tracking-tight text-[#FDFBF7] drop-shadow-[0_4px_12px_rgba(0,0,0,0.85)]">
      Austin Wong
    </h1>

    <!-- Subtitle -->
    <p class="mt-6 text-xs md:text-sm tracking-widest uppercase font-semibold text-[#FDFBF7]/90 flex flex-col md:flex-row md:items-center md:justify-center gap-2 md:gap-4 drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]">
      <span>Assistant Director</span>
      <span class="hidden md:inline text-xs text-[#FDFBF7]/40">|</span>
      <span>Director</span>
      <span class="hidden md:inline text-xs text-[#FDFBF7]/40">|</span>
      <span>Cinematographer</span>
    </p>

  </div>

</section>

    <!-- Showreel Section (Oil Black Background) -->
<section class="py-20 px-6 bg-[#0C0C0C] text-[#FDFBF7] border-b border-[#222222]">
  <div class="max-w-6xl mx-auto text-center">
    
    <!-- Section Title -->
    <h2 class="text-3xl md:text-4xl font-serif italic mb-8">
      My Latest Showreel
    </h2>

    <!-- Embedded YouTube Video Player -->
    <div class="relative w-full overflow-hidden rounded-lg shadow-2xl" style="padding-top: 56.25%;">
      <iframe 
        class="absolute top-0 left-0 w-full h-full border-0"
        src="https://www.youtube.com/embed/LLDK8VxzwjI" 
        title="Austin Wong Director Showreel" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

  </div>
</section>
    <!-- My Work Section -->
    <section class="bg-zinc-900 py-28 text-white text-center">
        <h2 class="serif text-5xl italic mb-16">My Work</h2>
        <div class="max-w-2xl mx-auto grid grid-cols-2 gap-6 px-6">
            <a href="films.html" class="border border-[#FDFBF7]/30 py-10 uppercase tracking-widest text-sm font-bold hover:bg-[#FDFBF7] hover:text-[#0C0C0C] transition-all">Film Credits</a>
            <a href="acting.html" class="border border-[#FDFBF7]/30 py-10 uppercase tracking-widest text-sm font-bold hover:bg-[#FDFBF7] hover:text-[#0C0C0C] transition-all">Acting Credits</a>
        </div>
    </section>

    <!-- Contact Section (Text +2 Size) -->
    <section id="contact" class="max-w-5xl mx-auto px-6 py-28 text-center">
        <h2 class="serif text-5xl italic mb-16">Contact</h2>
        <div class="flex flex-wrap justify-center gap-16 text-sm uppercase tracking-[0.3em] font-bold">
            <a href="https://instagram.com/austin_wzx_928" target="_blank" class="hover:opacity-50">Instagram</a>
            <a href="mailto:contact@austinwong.uk" class="hover:opacity-50">Email</a>
            <a href="https://linkedin.com/in/austin-wong-64900333b" target="_blank" class="hover:opacity-50">LinkedIn</a>
        </div>
        <p class="mt-24 text-[10px] uppercase tracking-[0.4em] opacity-40">© 2026 Austin Wong Zhen Xiang</p>
    </section>

</body>
</html>
