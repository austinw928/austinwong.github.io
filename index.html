<body class="bg-[#0C0C0C] text-[#FDFBF7] font-sans antialiased selection:bg-[#FDFBF7] selection:text-[#0C0C0C]">

      <h1 class="text-6xl md:text-8xl font-serif italic tracking-tight text-[#FDFBF7]">

      </h1>

      <!-- Subtitle (Indented slightly to the right with ~1.5 spacing gap) -->

    <h2 class="text-4xl md:text-5xl font-serif italic mb-6">Contact</h2>
    <p class="text-sm text-[#FDFBF7]/70 mb-8 max-w-md mx-auto">
      For inquiries regarding directing, cinematography, or acting roles, please reach out via the button below.
    </p>
    <a href="contact.html" class="inline-block px-8 py-4 border border-[#FDFBF7] text-xs tracking-widest uppercase font-bold hover:bg-[#FDFBF7] hover:text-[#0C0C0C] transition-all duration-300">
